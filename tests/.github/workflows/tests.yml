name: Tests

on:
  push:
    paths:
      - 'app.py'
      - 'solver.py'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install ortools pandas pytest

      - name: Run trip-structure tests
        run: python -m pytest tests/ -v
